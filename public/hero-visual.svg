<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <rect width="800" height="600" fill="#FAFBFC"/>

  <!-- Background soft shapes -->
  <circle cx="600" cy="120" r="80" fill="oklch(0.95 0.035 145)" opacity="0.4"/>
  <circle cx="180" cy="480" r="120" fill="oklch(0.95 0.035 145)" opacity="0.25"/>

  <!-- Building 1 -->
  <g transform="translate(120, 220)">
    <rect x="0" y="60" width="140" height="200" rx="12" fill="#FFFFFF" stroke="oklch(0.85 0.02 220)" stroke-width="2"/>
    <rect x="20" y="90" width="36" height="36" rx="6" fill="oklch(0.95 0.035 145)"/>
    <rect x="84" y="90" width="36" height="36" rx="6" fill="oklch(0.95 0.035 145)"/>
    <rect x="20" y="150" width="36" height="36" rx="6" fill="oklch(0.95 0.035 145)"/>
    <rect x="84" y="150" width="36" height="36" rx="6" fill="oklch(0.95 0.035 145)"/>
    <rect x="20" y="210" width="36" height="36" rx="6" fill="oklch(0.52 0.17 145)"/>
    <rect x="84" y="210" width="36" height="36" rx="6" fill="oklch(0.95 0.035 145)"/>
    <rect x="45" y="25" width="50" height="35" rx="6" fill="#FFFFFF" stroke="oklch(0.85 0.02 220)" stroke-width="2"/>
    <path d="M45 25L70 8L95 25" fill="#FFFFFF" stroke="oklch(0.85 0.02 220)" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- Building 2 -->
  <g transform="translate(320, 160)">
    <rect x="0" y="40" width="160" height="240" rx="12" fill="#FFFFFF" stroke="oklch(0.85 0.02 220)" stroke-width="2"/>
    <rect x="20" y="70" width="40" height="40" rx="6" fill="oklch(0.95 0.035 145)"/>
    <rect x="100" y="70" width="40" height="40" rx="6" fill="oklch(0.95 0.035 145)"/>
    <rect x="20" y="130" width="40" height="40" rx="6" fill="oklch(0.95 0.035 145)"/>
    <rect x="100" y="130" width="40" height="40" rx="6" fill="oklch(0.52 0.17 145)"/>
    <rect x="20" y="190" width="40" height="40" rx="6" fill="oklch(0.95 0.035 145)"/>
    <rect x="100" y="190" width="40" height="40" rx="6" fill="oklch(0.95 0.035 145)"/>
    <rect x="50" y="10" width="60" height="30" rx="6" fill="#FFFFFF" stroke="oklch(0.85 0.02 220)" stroke-width="2"/>
    <path d="M50 10L80 -8L110 10" fill="#FFFFFF" stroke="oklch(0.85 0.02 220)" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- Calendar / booking card -->
  <g transform="translate(540, 260)">
    <rect x="0" y="0" width="160" height="140" rx="16" fill="#FFFFFF" stroke="oklch(0.85 0.02 220)" stroke-width="2" shadow="sm"/>
    <rect x="0" y="0" width="160" height="32" rx="16" fill="oklch(0.52 0.17 145)"/>
    <text x="80" y="22" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="14" font-weight="600">Viewing Booked</text>
    <text x="80" y="72" text-anchor="middle" fill="oklch(0.15 0.02 220)" font-family="Inter, sans-serif" font-size="16" font-weight="600">Sat, Sep 6</text>
    <text x="80" y="96" text-anchor="middle" fill="oklch(0.5 0.015 220)" font-family="Inter, sans-serif" font-size="13">2:00 PM</text>
    <circle cx="80" cy="124" r="8" fill="oklch(0.6 0.15 145)"/>
    <path d="M76 124L79 127L85 121" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Chat bubble -->
  <g transform="translate(520, 120)">
    <rect x="0" y="0" width="180" height="80" rx="16" fill="oklch(0.52 0.17 145)"/>
    <circle cx="32" cy="32" r="12" fill="white" opacity="0.2"/>
    <rect x="56" y="22" width="100" height="8" rx="4" fill="white" opacity="0.7"/>
    <rect x="56" y="40" width="80" height="8" rx="4" fill="white" opacity="0.5"/>
    <circle cx="146" cy="58" r="10" fill="white"/>
    <path d="M142 58L145 61L151 55" stroke="oklch(0.52 0.17 145)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M0 64L-12 76L0 80" fill="oklch(0.52 0.17 145)"/>
  </g>

  <!-- Phone / voice agent -->
  <g transform="translate(140, 80)">
    <rect x="0" y="0" width="80" height="120" rx="12" fill="#FFFFFF" stroke="oklch(0.85 0.02 220)" stroke-width="2"/>
    <circle cx="40" cy="44" r="16" fill="oklch(0.95 0.035 145)"/>
    <path d="M40 32C34 32 34 56 40 56C46 56 46 32 40 32Z" fill="none" stroke="oklch(0.52 0.17 145)" stroke-width="2" stroke-linecap="round"/>
    <rect x="20" y="76" width="40" height="6" rx="3" fill="oklch(0.95 0.035 145)"/>
    <rect x="28" y="88" width="24" height="6" rx="3" fill="oklch(0.95 0.035 145)"/>
  </g>

  <!-- Decorative green dots -->
  <circle cx="680" cy="480" r="12" fill="oklch(0.52 0.17 145)" opacity="0.15"/>
  <circle cx="720" cy="440" r="8" fill="oklch(0.52 0.17 145)" opacity="0.2"/>
  <circle cx="60" cy="120" r="10" fill="oklch(0.52 0.17 145)" opacity="0.1"/>
</svg>
